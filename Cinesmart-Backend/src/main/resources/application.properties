# Secrets and environment-specific values come from env vars (see .env.example).

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Mail ---
spring.mail.host=${MAIL_HOST:smtp.ethereal.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=noreply@cinesmart.ca

# --- Redis (short timeouts so an outage doesn't hang requests, change.md Q24) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# --- JWT (access token) ---
jwt.secret=${JWT_SECRET}
jwt.issuer=cinesmart-api
jwt.access-token-ttl=PT15M

# --- Sessions and email tokens (change.md Q3, Q6, Q8) ---
auth.refresh.idle-ttl=PT2H
auth.refresh.max-session=P7D
auth.refresh.cookie-secure=true
auth.token.reset-ttl=PT10M
auth.token.verification-ttl=PT24H
auth.token.email-change-ttl=PT24H

# --- Login lockout (change.md Q1, Q5) ---
auth.lockout.max-user-failures=5
auth.lockout.max-ip-failures=10
auth.lockout.duration=PT1H

# --- Per-IP rate limits: max/window (change.md Q5) ---
# Honour X-Forwarded-For only behind a proxy that overwrites it.
app.trust-proxy=false
rate-limit.ip.login=10/PT1M
rate-limit.ip.account=5/PT15M
rate-limit.ip.token=10/PT15M
rate-limit.ip.public=120/PT1M

# --- Frontend ---
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Analytics batch (change.md Q12, Q13): full recompute every interval + once on startup ---
analytics.min-votes=5
analytics.refresh-interval=PT1H

# --- Per-user rate limits (change.md Q16): writes = activity PUT/DELETE, reads = /me/**, /recommendations ---
rate-limit.user.write=60/PT1M
rate-limit.user.read=120/PT1M

# --- Discovery (change.md Q19, Q21) ---
# Search: trigram word similarity on title or person name; a title match gets a small score boost.
search.similarity-threshold=0.3
search.title-boost=0.1
home.row-size=10
home.imdb-top-250.min-votes=25000

# --- Recommendation (change.md Q22, Q23) ---
# Signal weights; activity in the last recent-days counts recent-multiplier times.
recommendation.weight.rating-high=3
recommendation.weight.rating-mid=2
recommendation.weight.like=2
recommendation.weight.watched=1
recommendation.weight.watchlist=1
recommendation.recent-days=90
recommendation.recent-multiplier=1.5
recommendation.candidate-limit=300
recommendation.cold-start-min-signals=3
# Score = genre + people + language + imdb/10, each match component normalized 0-1 (also used by similar titles).
recommendation.score.genre=0.4
recommendation.score.people=0.3
recommendation.score.language=0.1
recommendation.score.imdb=0.2
similar.default-size=10
similar.max-size=30
