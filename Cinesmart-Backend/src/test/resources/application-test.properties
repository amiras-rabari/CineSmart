# Test profile only (@ActiveProfiles("test")). Everything not set here comes from
# src/main/resources/application.properties, so the tests check the real settings.

# --- Database / Redis ---
# Replaced by the Testcontainers @ServiceConnection beans (TestcontainersConfiguration).
# Dummy values so the app never falls back to your real database.
spring.datasource.url=jdbc:postgresql://replaced-by-testcontainers/none
spring.datasource.username=none
spring.datasource.password=none

# --- Mail: JavaMailSender is a Mockito mock in every integration test, nothing is sent ---
spring.mail.host=localhost
spring.mail.username=test
spring.mail.password=test

# --- JWT: fixed test-only key (base64 of 32 bytes) ---
jwt.secret=Y2luZXNtYXJ0LXRlc3Qtb25seS1zZWNyZXQtMzItYnl0ZXM=

# --- Analytics: the startup run still happens; the hourly run must not fire mid-test ---
analytics.refresh-interval=PT24H

# --- Quieter test logs ---
logging.level.root=WARN
logging.level.org.testcontainers=INFO
